name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@94e0a400c37209dfa5db0ab9dd25d0c7546522c0 # v2.2.0
        with:
          ignore_paths: node_modules
